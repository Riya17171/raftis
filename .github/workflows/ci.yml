name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests (including a 60 s chaos test)
        run: ./gradlew test --no-daemon -Draftis.chaosSeconds=60
      - name: Upload the chaos test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: build/chaos/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install redis-cli
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-tools
      - name: Start a 3-node cluster with Docker Compose
        run: docker compose up --build -d
      - name: Replication, failover after killing the leader, catch-up
        run: scripts/docker-smoke.sh
      - name: Container logs
        if: always()
        run: docker compose logs
